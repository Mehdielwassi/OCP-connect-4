<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>OCP Connect 4</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Modern, clean font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand-mark">
        <div class="brand-icon"></div>
        <span class="brand-text">OCP Connect 4</span>
      </div>
    </header>

    <main class="app-main">
      <section class="game-card">
        <div class="game-header">
          <div class="game-title-group">
            <h1 class="game-title">Connect 4</h1>
            <p class="game-subtitle">First to connect four discs in a row wins.</p>
          </div>

          <div class="status-panel">
            <div id="turn-indicator" class="player-indicator player1">
              <span class="indicator-dot"></span>
              <span id="turn-text">Player 1's turn</span>
            </div>
          </div>
        </div>

        <div class="board-wrapper">
          <div id="hover-row" class="hover-row"></div>
          <div id="board" class="board"></div>
        </div>

        <div class="game-footer">
          <div class="controls">
            <button id="restart-btn" class="btn primary">Restart game</button>
          </div>
          <div id="message" class="message">
            Player 1 starts. Connect four in a row.
          </div>
        </div>
      </section>
    </main>

    <footer class="app-footer">
      <span class="footer-text">Inspired by Groupe OCP · Clean green theme</span>
    </footer>
  </div>

  <!-- Player Name Modal -->
  <div id="player-modal" class="modal-overlay">
    <div class="modal-card">
      <h2 class="modal-title">Enter Player Names</h2>
      <div class="input-group">
        <label for="p1-name" class="input-label">Player 1 (Green)</label>
        <input type="text" id="p1-name" class="modal-input" placeholder="Player 1" />
      </div>
      <div class="input-group">
        <label for="p2-name" class="input-label">Player 2 (Teal)</label>
        <input type="text" id="p2-name" class="modal-input" placeholder="Player 2" />
      </div>
      <button id="start-game-btn" class="btn primary full-width">Start Game</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
